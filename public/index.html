<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Presupuesto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>📊 Dashboard de Control Presupuestario</h1>

    <div class="card">
        <form id="form">
            <select id="tipo">
                <option value="ingreso">Ingreso</option>
                <option value="egreso">Egreso</option>
            </select>

            <input type="number" id="monto" placeholder="Monto" required>
            <input type="text" id="descripcion" placeholder="Concepto">

            <button type="submit">Agregar</button>
        </form>
    </div>

    <!-- TABLA PRINCIPAL -->
    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>INGRESO</th>
                    <th>MONTO</th>
                    <th>EGRESO</th>
                    <th>MONTO</th>
                </tr>
            </thead>

            <tbody id="tabla-body"></tbody>

            <tfoot>
                <tr>
                    <td><strong>Subtotal</strong></td>
                    <td id="subtotal-ingresos">0</td>
                    <td><strong>Subtotal</strong></td>
                    <td id="subtotal-egresos">0</td>
                </tr>
                <tr>
                    <td colspan="3"><strong>TOTAL</strong></td>
                    <td id="total">0</td>
                </tr>
            </tfoot>
        </table>
    </div>

    <div class="card">
        <canvas id="grafico"></canvas>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="app.js"></script>

</body>
</html>
